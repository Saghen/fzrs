[package]
name = "frizbee-wasm"
description = "WASM bindings for frizbee, SIMD fuzzy string matching"
publish = false
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frizbee = { package = "neo_frizbee", path = "../..", default-features = false }
# pinned to the wasm-bindgen CLI version provided by the nix dev shell
wasm-bindgen = "=0.2.121"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = { version = "5", default-features = false, features = ["disable-realloc-in-place"] } # tiny allocator

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde = { version = "1", features = ["derive"] } # test JS deserialization
serde-wasm-bindgen = "0.6"
